# * Settings marked with * are advanced settings that won't appear in the Streamlit page and can only be modified manually in config.py
# recommend to set in streamlit page
# -------------------
# version: "3.0.3"
# author: "Huanshere"
# -------------------

## ======================== Basic Settings ======================== ##

display_language: "zh-CN"

# API settings
api:
  key: 'YOUR_API_KEY'
  base_url: 'https://generativelanguage.googleapis.com/v1beta/openai/'
  model: 'gemini-3.6-flash'
  llm_support_json: true
# *Number of LLM multi-threaded accesses, set to 1 if using local LLM
max_workers: 4

# Language settings, written into the prompt, can be described in natural language
target_language: 'English'

# Whether to use Demucs for vocal separation before transcription
demucs: true

whisper:
  # ["large-v3", "large-v3-turbo"]. Note: for zh model will force to use Belle/large-v3
  model: 'large-v3'
  # Whisper specified recognition language ISO 639-1
  language: 'zh'
  detected_language: 'en'
  # Whisper running mode ["local", "cloud", "elevenlabs", "qwen"]
  runtime: 'qwen'
  # 302.ai API key
  whisperX_302_api_key: 'your_302_api_key'
  # ElevenLabs API key (experimental)
  elevenlabs_api_key: 'your_elevenlabs_api_key'

# Qwen ASR / character-level forced alignment via DashScope filetrans
qwen_asr:
  api_key: 'your_qwen_api_key'
  model: 'qwen-audio-3.0-asr-flash-filetrans'
  language: 'zh'
  # Speaker diarization is only available on the filetrans v2 family
  # (qwen-audio-3.0 / fun-asr / paraformer), not on qwen3-asr-flash-filetrans.
  diarization: true
  speaker_count: 2
  gcs_bucket: 'hihub-test'
  gcs_prefix: 'qwen_asr_align'
  poll_interval_s: 3
  poll_timeout_s: 900

# Whether to burn subtitles into the video
burn_subtitles: false

## ======================== Advanced Settings ======================== ##
# *🔬 h264_nvenc GPU acceleration for ffmpeg, make sure your GPU supports it
ffmpeg_gpu: false

# *Youtube settings
youtube:
  cookies_path: ''

# *Default resolution for downloading YouTube videos [360, 1080, best]
ytb_resolution: '1080'

subtitle:
  # *Maximum length of each subtitle line in characters
  max_length: 75
  # *Translated subtitles are slightly larger than source subtitles, affecting the reference length for subtitle splitting
  target_multiplier: 1.2

# *Summary length, set low to 2k if using local LLM
summary_length: 8000

# *Maximum number of words for the first rough cut, below 18 will cut too finely affecting translation, above 22 is too long and will make subsequent subtitle splitting difficult to align
max_split_length: 20

# *Whether to reflect the translation result in the original text
reflect_translate: true

# *Whether to pause after extracting professional terms and before translation, allowing users to manually adjust the terminology table output\log\terminology.json
pause_before_translate: false

## ======================== Dubbing Settings ======================== ##
# TTS selection [sf_fish_tts, openai_tts, gpt_sovits, azure_tts, fish_tts, edge_tts, custom_tts, elevenlabs_tts, qwen_tts]
tts_method: 'elevenlabs_tts'

# NoizAI TTS (used by custom_tts)
# mode: clone = use output/audio/refers/{n}.wav like CosyVoice2; preset = fixed voice_id
noiz_tts:
  api_key: 'YOUR_API_KEY'
  voice_id: 'c1083343'
  mode: 'clone'
  target_lang: 'zh'
  speed: 1.0
  similarity_enh: true
  max_workers: 4

# ElevenLabs TTS
# clone creates a temporary voice from the exact timestamp reference and deletes it after TTS
elevenlabs_tts:
  api_key: 'YOUR_API_KEY'
  voice_id: ''
  mode: 'clone'
  model_id: 'eleven_v3'
  output_format: 'mp3_44100_128'
  stability: 0.5
  similarity_boost: 0.8
  style: 0.0
  use_speaker_boost: true
  # Cap at Scale/Business non-Flash concurrency (eleven_v3). Flash/Turbo can go to 30.
  max_workers: 15

# Qwen-Audio-3.0-TTS (DashScope)
# mode: clone = enroll temporary voice from refers/{n}.wav then delete; preset = fixed voice
# api_key falls back to QWEN_API_KEY / qwen_asr.api_key
qwen_tts:
  api_key: 'your_qwen_api_key'
  model: 'qwen-audio-3.0-tts-plus'
  mode: 'clone'
  voice: 'longanhuan_v3.6'
  language_hints: 'zh'
  speech_rate: 1.0
  instruction: ''
  # Stage 1: after audio tasks are built, LLM writes emotion tags into task text.
  emotion_tags: true
  enable_preprocess: false
  max_prompt_audio_length: 10.0
  # If enrollment ASR rejects the pooled refer, synthesize with qwen_tts.voice instead.
  fallback_preset_on_clone_fail: true
  # Clone spends most time waiting DEPLOYING; 6 workers pipeline past the 3 RPS synth cap.
  # Hard caps (Beijing): TTS submit 3 RPS, voice-enrollment 10 RPS — enforced in code.
  max_workers: 6
  base_http_api_url: 'https://dashscope.aliyuncs.com/api/v1'
  base_websocket_api_url: 'wss://dashscope.aliyuncs.com/api-ws/v1/inference'

# LLM speaker/utterance tagging for SRT dubbing
# Both merges require the same speaker/role.
# refer_merge_max_gap: pool clone reference audio
# tts_merge_max_gap: concatenate TTS text into one task (0 = never)
speaker_tagging:
  enabled: true
  min_confidence: 0.8
  max_gap: 2  # legacy fallback only
  refer_merge_max_gap: 3
  tts_merge_max_gap: 0.6

# Final audio mastering and original-audio passthrough
audio_mastering:
  target_lufs: -16.0
  voice_lufs: -18.0
  true_peak: -1.0
  loudness_range: 11.0
  crossfade_ms: 50
  audio_bitrate: '256k'
  background_ducking: true
  ducking_threshold: 0.03
  ducking_ratio: 6.0
  ducking_attack_ms: 20
  ducking_release_ms: 250
  preserve_original_vocals_in_gaps: true
  # Guard against ASR boundary drift so original speech tails stay muted
  gap_vocals_guard_ms: 250
  # Smaller pad used when char-level alignment is available
  gap_vocals_aligned_guard_ms: 60
  gap_vocals_merge_ms: 400
  gap_vocals_min_duration_ms: 700
  gap_vocals_gain: 0.8
  original_audio_intervals: []

# SiliconFlow FishTTS
sf_fish_tts:
  # SiliconFlow API key
  api_key: 'YOUR_API_KEY'
  # only for mode "preset"
  voice: 'anna'
  # *only for mode "custom", dont set manually
  custom_name: ''
  voice_id: ''
  # preset, custom, dynamic
  mode: "preset"

# OpenAI TTS-1 API configuration, 302.ai API only
openai_tts:
  api_key: 'YOUR_302_API_KEY'
  voice: 'alloy'

# Azure configuration, 302.ai API only
azure_tts:
  api_key: 'YOUR_302_API_KEY'
  voice: 'zh-CN-YunfengNeural'

# FishTTS configuration, 302.ai API only
fish_tts:
  api_key: 'YOUR_302_API_KEY'
  character: 'AD学姐'
  character_id_dict:
    'AD学姐': '7f92f8afb8ec43bf81429cc1c9199cb1'
    '丁真': '54a5170264694bfc8e9ad98df7bd89c3'

# SiliconFlow CosyVoice2 Clone
sf_cosyvoice2:
  api_key: 'YOUR_SF_KEY'

# Edge TTS configuration
edge_tts:
  voice: 'zh-CN-XiaoxiaoNeural'

# SoVITS configuration
gpt_sovits:
  character: 'Huanyuv2'
  refer_mode: 3

f5tts:
  302_api: 'YOUR_302_API_KEY'

# *Audio speed range
speed_factor:
  min: 1
  accept: 1.2 # Maximum acceptable speed
  max: 1.4

# *Merge audio configuration
min_subtitle_duration: 2.5 # Minimum subtitle duration, will be forcibly extended
min_trim_duration: 3.5 # Subtitles shorter than this value won't be split
tolerance: 1.5 # Allowed extension time to the next subtitle





## ======================== Additional settings ======================== ##

# Whisper model directory
model_dir: './_model_cache'

# Supported upload video formats
allowed_video_formats:
- 'mp4'
- 'mov'
- 'avi'
- 'mkv'
- 'flv'
- 'wmv'
- 'webm'

allowed_audio_formats:
- 'wav'
- 'mp3'
- 'flac'
- 'm4a'

# Spacy models
spacy_model_map:
  en: 'en_core_web_md'
  ru: 'ru_core_news_md'
  fr: 'fr_core_news_md'
  ja: 'ja_core_news_md'
  es: 'es_core_news_md'
  de: 'de_core_news_md'
  it: 'it_core_news_md'
  zh: 'zh_core_web_md'

# Languages that use space as separator
language_split_with_space:
- 'en'
- 'es'
- 'fr'
- 'de'
- 'it'
- 'ru'

# Languages that do not use space as separator
language_split_without_space:
- 'zh'
- 'ja'
